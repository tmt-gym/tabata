<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타바타 타이머</title>
<meta name="theme-color" content="#EC2B2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="타바타">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#16181B; --muted:#5C636B; --line:#D3D7DC;
  --c-prep:#FFC21A; --c-work:#EC2B2F; --c-rest:#2667E0; --c-done:#1FA35A;
  --num:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --txt:'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D20; --surface:#25282C; --ink:#F1F2F4; --muted:#9AA1A9; --line:#373B40;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D20; --surface:#25282C; --ink:#F1F2F4; --muted:#9AA1A9; --line:#373B40;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--txt);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}

/* ---------- setup ---------- */
.setup{max-width:460px;margin:0 auto;padding:24px 20px 28px;min-height:100%;display:flex;flex-direction:column}
.brand{font-family:var(--num);font-weight:900;font-size:clamp(4rem,22vw,5.5rem);line-height:.82;margin:8px 0 22px;letter-spacing:-.005em}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:.9rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mine{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
.mine:empty{display:none}
.mychip{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.mychip button{border:0;background:transparent;font-weight:600;font-size:.9rem;padding:9px 6px 9px 14px}
.mychip .del{padding:9px 13px 9px 6px;color:var(--muted)}
.mychip.on{background:var(--ink);border-color:var(--ink)}
.mychip.on button{color:var(--bg)}
.mychip.arm .del{color:var(--c-work);font-weight:800}
.addchip{border:1.5px dashed var(--muted);background:transparent;border-radius:999px;padding:9px 14px;font-size:.9rem;font-weight:600;color:var(--muted)}
.saveform{display:flex;gap:8px;margin:0 0 18px}
.saveform[hidden]{display:none}
.saveform input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.saveform button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--ink);color:var(--bg)}
.saveform button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.rows{background:var(--surface);border-radius:6px;padding:0 16px}
.row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;min-height:68px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.dim{opacity:.4}
.sw{width:10px;height:28px;border-radius:2px;background:var(--c,transparent)}
.lab{font-weight:600;font-size:1rem}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:1.4rem;line-height:1;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.step button:disabled{opacity:.35;cursor:default}
.val{min-width:76px;text-align:center;font-family:var(--num);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.val small{font-family:var(--txt);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:2px}
.toggle{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--c-done)}
.toggle[aria-pressed="true"]::after{transform:translateX(22px)}
.soundctl{display:flex;align-items:center;gap:10px}
.try{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-size:.85rem;font-weight:600}
.go{margin-top:auto;padding-top:24px}
.start{width:100%;border:0;border-radius:14px;background:var(--c-work);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:baseline}
.start b{font-size:1.5rem;font-weight:800}
.start span{font-size:.95rem;font-weight:600;opacity:.9}
.hint{color:var(--muted);font-size:.8rem;margin:12px 2px 0;line-height:1.5}

/* ---------- running ---------- */
.run{position:fixed;inset:0;z-index:10;overflow:hidden;display:flex;flex-direction:column;
  background:var(--pd);color:var(--pi);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.run[hidden]{display:none}
.run[data-phase="prep"]{--p:#FFC21A;--pd:#DFA200;--pi:#17181A}
.run[data-phase="work"]{--p:#EC2B2F;--pd:#B3141A;--pi:#FFFFFF}
.run[data-phase="rest"],.run[data-phase="setrest"]{--p:#2667E0;--pd:#163E92;--pi:#FFFFFF}
.run[data-phase="done"]{--p:#1FA35A;--pd:#157443;--pi:#FFFFFF}
.level{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--p);z-index:0}
.run > :not(.level){position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.phase{font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);margin:0}
.meta{font-weight:600;font-size:.95rem;text-align:right;line-height:1.4}
.bars{display:flex;gap:4px;margin-top:14px}
.bars i{flex:1;height:8px;border-radius:2px;border:1.5px solid var(--pi);opacity:.55}
.bars i.d{background:var(--pi);opacity:.9}
.bars i.c{background:var(--pi);opacity:1;height:8px;box-shadow:0 0 0 2px var(--pi)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.big{font-family:var(--num);font-weight:900;line-height:.8;font-size:min(62vw,48vh);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big.long{font-size:min(40vw,34vh)}
.big.word{font-family:var(--txt);font-weight:800;font-size:min(40vw,30vh);line-height:1}
.run.paused .big{opacity:.4}
.big.thump{animation:thump .2s ease-out}
@keyframes thump{0%{transform:scale(1.06)}100%{transform:scale(1)}}
.run[data-phase="rest"] .big,.run[data-phase="setrest"] .big{animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@media (prefers-reduced-motion: reduce){.big.thump,.run[data-phase="rest"] .big,.run[data-phase="setrest"] .big{animation:none}}
.next{font-weight:600;font-size:1.05rem;margin-top:18px;text-align:center;min-height:1.4em}
.pausenote{font-weight:800;font-size:1.1rem;margin-top:6px;visibility:hidden}
.run.paused .pausenote{visibility:visible}
.ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctl.two{grid-template-columns:1fr 1fr}
.ctl[hidden]{display:none}
.ctl button{min-height:60px;border-radius:14px;border:2px solid var(--pi);background:transparent;font-weight:800;font-size:1rem;padding:6px}
.ctl button.main{background:var(--pi);color:var(--pd);font-size:1.15rem}
.ctl button.armed{background:var(--pi);color:var(--pd)}
</style>
</head>
<body>

<main class="setup" id="setup">
  <h1 class="brand">TABATA</h1>
  <div class="presets" id="presets" role="group" aria-label="프리셋"></div>
  <div class="mine" id="mine" role="group" aria-label="내 패턴"></div>
  <form class="saveform" id="saveForm" hidden>
    <input id="presetName" maxlength="20" aria-label="패턴 이름" autocomplete="off">
    <button type="submit">저장</button>
    <button type="button" class="ghost" id="cancelSave">취소</button>
  </form>
  <div class="rows" id="rows"></div>
  <div class="go">
    <button class="start" id="startBtn"><b>시작</b><span id="total"></span></button>
    <p class="hint">소리가 안 들리면 무음 모드를 끄고 미디어 볼륨을 올려 주세요. 운동 중에는 화면이 꺼지지 않게 유지합니다.</p>
  </div>
</main>

<section class="run" id="run" hidden aria-live="polite">
  <div class="level" id="level"></div>
  <div class="top">
    <h2 class="phase" id="phaseName">준비</h2>
    <div class="meta"><div id="roundInfo"></div><div id="setInfo"></div></div>
  </div>
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="center">
    <div class="big" id="big" role="timer">10</div>
    <div class="pausenote">일시정지됨</div>
    <div class="next" id="next"></div>
  </div>
  <div class="ctl" id="ctlRun">
    <button id="stopBtn">운동종료</button>
    <button class="main" id="pauseBtn">일시정지</button>
    <button id="skipBtn">건너뛰기</button>
  </div>
  <div class="ctl two" id="ctlDone" hidden>
    <button id="backBtn">설정으로</button>
    <button class="main" id="againBtn">다시 하기</button>
  </div>
</section>

<script>
(function(){
const $ = id => document.getElementById(id);
const DEF = {prep:10, work:20, rest:10, rounds:8, sets:1, setRest:60, sound:true, beat:true};
const FIELDS = [
  {k:'prep',    l:'준비',        c:'var(--c-prep)', time:true, min:0, max:60,  st:5},
  {k:'work',    l:'운동',        c:'var(--c-work)', time:true, min:5, max:300, st:5},
  {k:'rest',    l:'휴식',        c:'var(--c-rest)', time:true, min:0, max:300, st:5},
  {k:'rounds',  l:'라운드',      u:'회', min:1, max:30, st:1},
  {k:'sets',    l:'세트',        u:'회', min:1, max:10, st:1},
  {k:'setRest', l:'세트 사이 휴식', c:'var(--c-rest)', time:true, min:0, max:600, st:10}
];
const PRESETS = [
  {n:'클래식 20/10', v:{work:20, rest:10, rounds:8}},
  {n:'입문 15/15',   v:{work:15, rest:15, rounds:8}},
  {n:'지구력 40/20', v:{work:40, rest:20, rounds:8}}
];
const NAMES = {prep:'준비', work:'운동', rest:'휴식', setrest:'세트 휴식', done:'완료'};

let cfg = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem('tabata-cfg') || 'null'); if(s && typeof s === 'object') return Object.assign({}, DEF, s); }catch(e){}
  return Object.assign({}, DEF);
}
function save(){ try{ localStorage.setItem('tabata-cfg', JSON.stringify(cfg)); }catch(e){} }

function fmtShort(s){ return s >= 60 ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : String(s); }
function fmtLong(s){ const m = Math.floor(s/60), r = s%60; return m ? (r ? m+'분 '+r+'초' : m+'분') : r+'초'; }

/* ---------- setup UI ---------- */
const rowsEl = $('rows'), presetsEl = $('presets');
PRESETS.forEach((p,i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = p.n; b.dataset.i = i;
  b.addEventListener('click', () => { Object.assign(cfg, p.v); save(); renderSetup(); });
  presetsEl.appendChild(b);
});

/* ---------- my saved patterns ---------- */
const KEYS = ['prep','work','rest','rounds','sets','setRest'];
const mineEl = $('mine'), formEl = $('saveForm'), nameEl = $('presetName');
let myPresets = [], store = null;
function validPreset(p){ return p && typeof p.name === 'string' && KEYS.every(k => Number.isFinite(p[k])); }
function clampPreset(p){
  const o = {id: String(p.id || Date.now().toString(36)), name: p.name.slice(0, 20)};
  FIELDS.forEach(f => { o[f.k] = Math.min(f.max, Math.max(f.min, Math.round(p[f.k]))); });
  return o;
}
try{
  const a = JSON.parse(localStorage.getItem('tabata-presets') || '[]');
  if(Array.isArray(a)) myPresets = a.filter(validPreset).map(clampPreset);
}catch(e){}
function saveLocal(){ try{ localStorage.setItem('tabata-presets', JSON.stringify(myPresets)); }catch(e){} }
async function persist(){ saveLocal(); if(store){ try{ await store(myPresets); }catch(e){} } }
function suggestName(){ return cfg.work + '/' + cfg.rest + ' ' + cfg.rounds + '라운드' + (cfg.sets > 1 ? ' ' + cfg.sets + '세트' : ''); }
function renderMine(){
  mineEl.innerHTML = '';
  myPresets.forEach(p => {
    const wrap = document.createElement('span'); wrap.className = 'mychip';
    const on = KEYS.every(k => p[k] === cfg[k]);
    if(on) wrap.classList.add('on');
    const a = document.createElement('button');
    a.textContent = p.name; a.setAttribute('aria-pressed', String(on));
    a.addEventListener('click', () => { KEYS.forEach(k => { cfg[k] = p[k]; }); save(); renderSetup(); });
    const d = document.createElement('button');
    d.className = 'del'; d.textContent = '×'; d.setAttribute('aria-label', p.name + ' 삭제');
    let armT = 0;
    d.addEventListener('click', () => {
      if(wrap.classList.contains('arm')){
        clearTimeout(armT);
        myPresets = myPresets.filter(x => x.id !== p.id);
        persist(); renderSetup(); return;
      }
      wrap.classList.add('arm'); d.textContent = '삭제';
      armT = setTimeout(() => { wrap.classList.remove('arm'); d.textContent = '×'; }, 2500);
    });
    wrap.append(a, d); mineEl.appendChild(wrap);
  });
  if(myPresets.length < 12 && formEl.hidden){
    const add = document.createElement('button');
    add.className = 'addchip'; add.textContent = '+ 지금 설정 저장';
    add.addEventListener('click', openForm);
    mineEl.appendChild(add);
  }
}
function openForm(){ formEl.hidden = false; nameEl.value = suggestName(); renderMine(); nameEl.focus(); nameEl.select(); }
function closeForm(){ formEl.hidden = true; renderMine(); }
formEl.addEventListener('submit', e => {
  e.preventDefault();
  const p = {id: Date.now().toString(36), name: (nameEl.value.trim() || suggestName()).slice(0, 20)};
  KEYS.forEach(k => { p[k] = cfg[k]; });
  myPresets.push(p);
  persist(); closeForm();
});
$('cancelSave').addEventListener('click', closeForm);

function holdRepeat(btn, fn){
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => {
    if(btn.disabled) return;
    e.preventDefault(); fn();
    t1 = setTimeout(() => { t2 = setInterval(() => { if(btn.disabled) stop(); else fn(); }, 90); }, 400);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); } });
}

FIELDS.forEach(f => {
  const row = document.createElement('div');
  row.className = 'row'; row.id = 'row-' + f.k;
  row.innerHTML = '<span class="sw"' + (f.c ? ' style="--c:' + f.c + '"' : '') + '></span>' +
    '<span class="lab">' + f.l + '</span>' +
    '<div class="step"><button aria-label="' + f.l + ' 줄이기">−</button>' +
    '<output class="val" aria-live="polite"></output>' +
    '<button aria-label="' + f.l + ' 늘리기">+</button></div>';
  const [minus, plus] = row.querySelectorAll('button');
  holdRepeat(minus, () => change(f, -1));
  holdRepeat(plus,  () => change(f, +1));
  rowsEl.appendChild(row);
});
const soundRow = document.createElement('div');
soundRow.className = 'row';
soundRow.innerHTML = '<span class="sw"></span><span class="lab">소리</span><div class="soundctl"><button class="try" id="tryBtn">들어보기</button><button class="toggle" id="soundBtn" aria-label="소리"></button></div>';
rowsEl.appendChild(soundRow);
const beatRow = document.createElement('div');
beatRow.className = 'row';
beatRow.innerHTML = '<span class="sw"></span><span class="lab">배경 비트</span><button class="toggle" id="beatBtn" aria-label="배경 비트"></button>';
rowsEl.appendChild(beatRow);
$('soundBtn').addEventListener('click', () => { cfg.sound = !cfg.sound; save(); renderSetup(); });
$('tryBtn').addEventListener('click', () => { ensureAudio(); const was = cfg.sound; cfg.sound = true; play([['ring',0,1.0],['ring',9,1.0],['ring',18,1.0]].concat(FINAL_RING.map(n => [n[0], n[1] + 27, n[2], n[3], n[4]]))); cfg.sound = was; });
$('beatBtn').addEventListener('click', () => { cfg.beat = !cfg.beat; save(); renderSetup(); });

function change(f, dir){
  const v = Math.min(f.max, Math.max(f.min, cfg[f.k] + dir * f.st));
  if(v === cfg[f.k]) return;
  cfg[f.k] = v; save(); renderSetup();
}

function renderSetup(){
  FIELDS.forEach(f => {
    const row = $('row-' + f.k), v = cfg[f.k], out = row.querySelector('output');
    const [minus, plus] = row.querySelectorAll('button');
    if(f.time){
      if(v === 0) out.innerHTML = '<small>없음</small>';
      else out.innerHTML = fmtShort(v) + (v < 60 ? '<small>초</small>' : '');
    } else out.innerHTML = v + '<small>' + f.u + '</small>';
    minus.disabled = v <= f.min; plus.disabled = v >= f.max;
  });
  const sr = $('row-setRest'); const off = cfg.sets <= 1;
  sr.classList.toggle('dim', off);
  sr.querySelectorAll('button').forEach(b => { if(off) b.disabled = true; });
  presetsEl.querySelectorAll('.chip').forEach(b => {
    const p = PRESETS[b.dataset.i].v;
    b.setAttribute('aria-pressed', String(p.work === cfg.work && p.rest === cfg.rest && p.rounds === cfg.rounds));
  });
  $('soundBtn').setAttribute('aria-pressed', String(!!cfg.sound));
  $('beatBtn').setAttribute('aria-pressed', String(!!cfg.beat));
  $('beatBtn').disabled = !cfg.sound;
  beatRow.classList.toggle('dim', !cfg.sound);
  $('total').textContent = '총 ' + fmtLong(build().reduce((a,p) => a + p.d, 0));
  renderMine();
}

/* ---------- workout sequence ---------- */
function build(){
  const p = [];
  if(cfg.prep > 0) p.push({t:'prep', d:cfg.prep, r:0, s:1});
  for(let s = 1; s <= cfg.sets; s++){
    for(let r = 1; r <= cfg.rounds; r++){
      p.push({t:'work', d:cfg.work, r, s});
      if(r < cfg.rounds && cfg.rest > 0) p.push({t:'rest', d:cfg.rest, r, s});
    }
    if(s < cfg.sets && cfg.setRest > 0) p.push({t:'setrest', d:cfg.setRest, r:cfg.rounds, s});
  }
  return p;
}

/* ---------- audio, vibration, wake lock ---------- */
let ac = null;
function ensureAudio(){
  try{
    if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
  }catch(e){}
}
/* Groove engine: drums + marimba through a loud, compressed bus */
let bus = null, limiter = null, softBus = null;
function getLimiter(){
  if(limiter) return limiter;
  limiter = ac.createDynamicsCompressor();
  limiter.threshold.value = -1; limiter.knee.value = 0; limiter.ratio.value = 20;
  limiter.attack.value = 0.001; limiter.release.value = 0.1;
  limiter.connect(ac.destination);
  return limiter;
}
/* Main bus: heavy gain + compression + makeup, capped by the limiter = as loud as possible */
function getBus(){
  if(bus) return bus;
  const pre = ac.createGain(); pre.gain.value = 5;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 4; comp.ratio.value = 16;
  comp.attack.value = 0.002; comp.release.value = 0.15;
  const makeup = ac.createGain(); makeup.gain.value = 3;
  pre.connect(comp); comp.connect(makeup); makeup.connect(getLimiter());
  return bus = pre;
}
/* Soft bus for the rest heartbeat: skips the loudness boost */
function getSoftBus(){
  if(softBus) return softBus;
  softBus = ac.createGain(); softBus.gain.value = .55;
  softBus.connect(getLimiter());
  return softBus;
}
let noiseBuf = null;
function noise(){
  if(noiseBuf) return noiseBuf;
  const len = Math.floor(ac.sampleRate * .5);
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function env(g, t, peak, dec){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
}
function noiseHit(t, type, freq, q, peak, dec){
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(g, t, peak, dec);
  s.connect(f); f.connect(g); g.connect(getBus());
  s.start(t); s.stop(t + dec + 0.02);
}
function osc(t, type, freq, peak, dec, sweepTo, dest){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + .12);
  env(g, t, peak, dec);
  o.connect(g); g.connect(dest || getBus());
  o.start(t); o.stop(t + dec + 0.02);
}
const SYN = {
  kick: (t, v) => osc(t, 'sine', 160, .9 * (v || 1), .28, 45),
  clap: (t, v) => { [0, .012, .024].forEach((o, i) => noiseHit(t + o, 'bandpass', 1600, .9, .7 * (v || 1), i === 2 ? .14 : .02)); },
  hat:  (t, v) => noiseHit(t, 'highpass', 7000, .7, .35 * (v || 1), .05),
  wood: (t, f) => { osc(t, 'sine', f, .7, .07); osc(t, 'sine', f * 2.4, .2, .03); },
  mar:  (t, f, dur) => { dur = dur || .4; osc(t, 'sine', f, .5, dur); osc(t, 'sine', f * 4, .14, dur * .25); },
  bass: (t, f) => { osc(t, 'sine', f, .38, .22); osc(t, 'sine', f * 4, .08, .05); },
  pad: (t, f, dur) => {
    const g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1200;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(.09, t + .35);
    g.gain.setValueAtTime(.09, t + dur - .4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    [['sine', f], ['triangle', f * 1.004]].forEach(([ty, fr]) => {
      const o = ac.createOscillator(); o.type = ty; o.frequency.value = fr;
      o.connect(lp); o.start(t); o.stop(t + dur + .05);
    });
    lp.connect(g); g.connect(getBus());
  },
  keys: (t, f) => { osc(t, 'sine', f, .22, 1.1); osc(t, 'sine', f * 2, .05, .4); },
  rim:  (t, v) => noiseHit(t, 'bandpass', 2400, 2, .15 * (v || 1), .04),
  heart: (t, v) => { v = v || 1; const sb = getSoftBus(); osc(t, 'sine', 130, .55 * v, .2, 55, sb); osc(t, 'triangle', 190, .12 * v, .08, 0, sb); },
  shaker: (t, v) => noiseHit(t, 'highpass', 5000, .6, .07 * (v || 1), .07),
  crash: (t, v) => { v = v || 1; noiseHit(t, 'highpass', 4500, .5, .45 * v, .9); noiseHit(t, 'bandpass', 8000, .8, .25 * v, .5); },
  tom: (t, f) => osc(t, 'sine', f || 200, .75, .25, (f || 200) * .55),
  bigkick: (t) => { osc(t, 'sine', 190, 1, .4, 42); osc(t, 'triangle', 120, .5, .15, 60); noiseHit(t, 'highpass', 3000, .7, .4, .015); },
  ring: (t, dur, v, pitch) => {
    dur = dur || 1.4;
    const bus = getBus(), base = 830 * (pitch || 1);
    const P = [[1,1,1],[1.006,.6,1],[1.51,.45,.7],[2,.35,.6],[2.76,.5,.5],[3.43,.3,.35],[4.2,.25,.25],[5.4,.18,.18],[6.8,.12,.12]];
    P.forEach(([r, a, dm]) => {
      const o = ac.createOscillator(), g = ac.createGain(), d = dur * dm;
      o.type = 'sine'; o.frequency.value = base * r;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(a * .3 * (v || 1), t + .002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .03);
    });
    noiseHit(t, 'bandpass', 3500, 1.5, .5, .03);
  },
  hum: (t, f) => {
    osc(t, 'sine', f, .55, 2.4);
    osc(t, 'sine', f * .5, .4, 1.4);
    noiseHit(t, 'lowpass', 300, .7, .35, .1);
  },
  boom: (t) => {
    osc(t, 'sine', 160, 1, .75, 38);
    osc(t, 'sine', 95, .7, .55, 45);
    osc(t, 'triangle', 220, .35, .18, 110);
    noiseHit(t, 'lowpass', 400, .7, .55, .14);
    noiseHit(t, 'highpass', 3000, .7, .45, .015);
    noiseHit(t, 'bandpass', 1800, .7, .5, .28);
  },
  stab: (t, k, dur) => {
    dur = dur || .45;
    const fs = STABS[k] || STABS.start, g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 2;
    lp.frequency.setValueAtTime(7000, t);
    lp.frequency.exponentialRampToValueAtTime(1800, t + dur * .6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.12, t + .005);
    g.gain.exponentialRampToValueAtTime(.075, t + dur * .5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    fs.forEach(f => [.996, 1.004].forEach(d => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * d;
      o.connect(lp); o.start(t); o.stop(t + dur + .03);
    }));
    lp.connect(g); g.connect(getBus());
  },
  soft: (t, f) => {
    const g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1500;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(.2, t + .12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    [[f, 1], [f * 2, .12]].forEach(([fr, a]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sine'; o.frequency.value = fr; og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + 2.7);
    });
    lp.connect(g); g.connect(getBus());
  },
  whistle: (t, dur, pitch) => {
    dur = dur || .18; pitch = pitch || 1;
    const bus = getBus(), g = ac.createGain(), am = ac.createGain();
    const o1 = ac.createOscillator(), o2 = ac.createOscillator();
    const lfo = ac.createOscillator(), fmDepth = ac.createGain(), amDepth = ac.createGain();
    o1.type = 'sine'; o1.frequency.setValueAtTime(2850 * pitch, t);
    o2.type = 'sine'; o2.frequency.setValueAtTime(2990 * pitch, t);
    if(dur > .25){
      o1.frequency.exponentialRampToValueAtTime(2850 * pitch * 1.09, t + dur * .6);
      o2.frequency.exponentialRampToValueAtTime(2990 * pitch * 1.09, t + dur * .6);
    }
    lfo.type = 'sine'; lfo.frequency.value = 34;
    fmDepth.gain.value = 160; amDepth.gain.value = .35; am.gain.value = .65;
    lfo.connect(fmDepth); fmDepth.connect(o1.frequency); fmDepth.connect(o2.frequency);
    lfo.connect(amDepth); amDepth.connect(am.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.6, t + .012);
    g.gain.setValueAtTime(.6, t + Math.max(.02, dur - .035));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(am); o2.connect(am); am.connect(g); g.connect(bus);
    [o1, o2, lfo].forEach(o => { o.start(t); o.stop(t + dur + .02); });
    noiseHit(t, 'bandpass', 2900, 3, .1, dur);
  }
};
const S = .11;
function hit(k, when, a, b, c){
  if(!cfg.sound || !ac) return;
  try{ SYN[k](ac.currentTime + .02 + when, a, b, c); }catch(e){}
}
function play(seq){ seq.forEach(n => hit(n[0], n[1] * S, n[2], n[3], n[4])); }
/* Final bell: grace strike, then one hit layering a bright high bell, a low bell an octave down,
   a deep hum and a tight kick = lively on top, heavy underneath */
const FINAL_RING = [
  ['ring',0,.35,.9,1],
  ['ring',.7,1.8,2.0,1.26],
  ['ring',.7,1.4,1.2,1.89],
  ['ring',.7,1.0,.8,2.52],
  ['bigkick',.7]
];
const N = {G4:392, C5:523, E5:659, G5:784, C6:1047, E6:1319};
const JINGLE = {
  prep: [['wood',0,1200],['wood',1.5,1200]],
  work: [
    ['kick',0],['mar',0,N.C5],['hat',1],['mar',1,N.E5],['clap',2],['mar',2,N.G5],
    ['kick',3],['hat',3],['mar',3,N.C6],['kick',4],['hat',5],['mar',5,N.G5],
    ['clap',6],['mar',6,N.C6,.6],['mar',6,N.E6,.6]
  ],
  rest: [['mar',0,N.G5],['hat',0,.5],['mar',1.5,N.E5],['hat',1.5,.5],['kick',3,.6],['mar',3,N.C5,.7]],
  setrest: [['mar',0,N.G5],['hat',0,.5],['mar',1.5,N.E5],['hat',1.5,.5],['kick',3,.6],['mar',3,N.C5,.5],['mar',4.5,N.G4,.9]],
  done: [
    /* short and heavy: 둥-둥-쾅! with a low + bright bell chord on the hit */
    ['bigkick',0],['tom',1.5,180],['bigkick',1.5],
    ['boom',3],['crash',3,1.3],['clap',3,1.3],
    ['ring',3,1.6,1.4,.63],['ring',3,1.4,1.2,1.26]
  ]
};
const TICKS = {
  3: [['kick',0],['mar',0,N.E5,.18],['hat',1],['hat',2,.6]],
  2: [['kick',0],['mar',0,N.G5,.18],['hat',1],['mar',2,N.G5,.12],['hat',2,.6]],
  1: [['kick',0],['clap',0],['mar',0,N.C6,.2],['hat',1],['mar',2,N.E6,.12],['hat',2],['hat',3,.7]]
};
const WHISTLE = {
  3: [['ring',0,1.0]],
  2: [['ring',0,1.0]],
  1: [['ring',0,1.0]]
};
function tick(sec, overBeat, toWork){
  if(toWork || (running && phases[idx] && phases[idx].t === 'work')){ if(WHISTLE[sec]) play(WHISTLE[sec]); return; }
  if(!TICKS[sec]) return;
  if(overBeat) return;
  play(TICKS[sec]);
}

/* Background beat during work: four-on-the-floor + marimba riff, C-Am-F-G */
const ROOTS = [523, 440, 349, 392];
const RIFF = {0:1, 3:1, 6:1.5, 10:2, 12:1.5};
let beatOn = false, beatNext = 0, beatStep = 0, beatTimer = 0, beatMode = 'work';
function beatStart(delay, mode){
  if(!cfg.beat || !cfg.sound || !ac || paused) return;
  beatStop();
  beatMode = mode || 'work'; restGap = 4 * S;
  beatOn = true; beatStep = 0; beatNext = ac.currentTime + delay;
  beatTimer = setInterval(beatSched, 50);
  beatSched();
}
function beatStop(){ beatOn = false; clearInterval(beatTimer); }
function beatSched(){
  if(!beatOn) return;
  while(beatNext < ac.currentTime + .12){
    if(beatMode === 'rest'){ restPlay(beatNext); beatNext += restGap; }
    else { beatPlay(beatStep, beatNext); beatNext += S; }
    beatStep++;
  }
}
/* Rest beat: heartbeat (lub-dub) that starts fast and slowly calms down */
let restGap = 4 * S;
function restPlay(t){
  try{
    SYN.heart(t, 1);
    SYN.heart(t + .17, .65);
  }catch(e){}
}
function beatPlay(i, t){
  const s = i % 16, root = ROOTS[Math.floor(i / 16) % 4];
  try{
    if(s % 4 === 0){
      SYN.kick(t, .7);
      setTimeout(() => { if(!beatOn) return; bigEl.classList.remove('thump'); void bigEl.offsetWidth; bigEl.classList.add('thump'); }, Math.max(0, (t - ac.currentTime) * 1000));
    }
    if(s === 4 || s === 12) SYN.clap(t, .6);
    if(s % 4 === 2) SYN.hat(t, .6); else if(s % 2 === 1) SYN.hat(t, .25);
    if(RIFF[s]) SYN.bass(t, root * RIFF[s]);
  }catch(e){}
}
function vib(){}
const STABS = { start: [523, 659, 784, 1047], end: [392, 523, 659, 784] };
const HIT_START = [['boom',0],['clap',0,1.3],['crash',0,1.3]];
const HIT_END   = [['boom',0],['clap',0,1.3],['crash',0,1.3]];
function cue(t){
  beatStop();
  if(t === 'rest' || t === 'setrest') play(FINAL_RING);
  else if(t !== 'work' && JINGLE[t]) play(JINGLE[t]);
  if(t === 'work') play(FINAL_RING);
  if(t === 'work') beatStart(.02);
  else if(t === 'rest' || t === 'setrest') beatStart(.02 + 5 * S, 'rest');
  else if(t === 'prep') beatStart(.02 + 3 * S, 'rest');
  if(t === 'work') vib(300);
  else if(t === 'rest' || t === 'setrest') vib([100,80,100]);
}
let wl = null;
async function lock(){
  try{ if('wakeLock' in navigator && !wl){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } }catch(e){}
}
function unlock(){ try{ wl && wl.release(); }catch(e){} wl = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && running) lock(); });

/* ---------- runner ---------- */
const runEl = $('run'), bigEl = $('big'), levelEl = $('level'), pauseBtn = $('pauseBtn'), stopBtn = $('stopBtn');
let running = false, paused = false, phases = [], idx = 0, endAt = 0, pausedRemain = 0, lastSec = -1, raf = 0, iv = 0, stopTimer = 0;

function setBig(sec){
  const s = fmtShort(sec);
  bigEl.textContent = s;
  bigEl.className = 'big' + (s.length >= 4 ? ' long' : '');
}
function drawBars(ph){
  const bars = $('bars'); bars.innerHTML = '';
  for(let r = 1; r <= cfg.rounds; r++){
    const i = document.createElement('i');
    if(ph.t === 'done' || ph.t === 'setrest' || (ph.t === 'rest' && r <= ph.r) || (ph.t === 'work' && r < ph.r)) i.className = 'd';
    else if(ph.t === 'work' && r === ph.r) i.className = 'c';
    bars.appendChild(i);
  }
}
function paint(ph){
  runEl.dataset.phase = ph.t;
  $('phaseName').textContent = NAMES[ph.t];
  $('roundInfo').textContent = ph.t === 'prep' ? cfg.rounds + '라운드' : '라운드 ' + ph.r + '/' + cfg.rounds;
  $('setInfo').textContent = cfg.sets > 1 ? '세트 ' + ph.s + '/' + cfg.sets : '';
  drawBars(ph);
  const n = phases[idx + 1];
  $('next').textContent = n ? '다음은 ' + NAMES[n.t] + ' ' + fmtLong(n.d) : '마지막 구간이에요';
  setBig(ph.d);
  levelEl.style.height = '100%';
}
function enter(i, base){
  idx = i;
  if(i >= phases.length){ finish(); return false; }
  const ph = phases[i];
  endAt = base + ph.d * 1000; lastSec = -1;
  paint(ph); cue(ph.t);
  return true;
}
function step(){
  if(!running || paused) return;
  const now = performance.now();
  while(now >= endAt){ if(!enter(idx + 1, endAt)) return; }
  const ph = phases[idx], rem = endAt - now, sec = Math.ceil(rem / 1000);
  if(sec !== lastSec){
    if(lastSec !== -1 && sec <= 3 && sec >= 1) tick(sec, beatOn, !!phases[idx + 1] && phases[idx + 1].t === 'work');
    lastSec = sec; setBig(sec);
  }
  levelEl.style.height = (rem / (ph.d * 1000) * 100).toFixed(2) + '%';
}
function frame(){ step(); if(running) raf = requestAnimationFrame(frame); }

function startWorkout(){
  ensureAudio();
  phases = build();
  if(!phases.length) return;
  running = true; paused = false;
  runEl.classList.remove('paused'); pauseBtn.textContent = '일시정지'; disarmStop();
  $('ctlRun').hidden = false; $('ctlDone').hidden = true;
  runEl.hidden = false; document.body.style.overflow = 'hidden';
  enter(0, performance.now());
  cancelAnimationFrame(raf); clearInterval(iv);
  raf = requestAnimationFrame(frame);
  iv = setInterval(step, 200);
  lock();
  pauseBtn.focus({preventScroll:true});
}
function halt(){ beatStop(); running = false; cancelAnimationFrame(raf); clearInterval(iv); unlock(); }
function finish(){
  halt();
  const total = phases.reduce((a,p) => a + p.d, 0);
  runEl.classList.remove('paused');
  runEl.dataset.phase = 'done';
  $('phaseName').textContent = NAMES.done;
  $('roundInfo').textContent = ''; $('setInfo').textContent = '';
  drawBars({t:'done'});
  bigEl.textContent = '끝'; bigEl.className = 'big word';
  $('next').textContent = (cfg.rounds * cfg.sets) + '라운드 완료, 총 ' + fmtLong(total);
  levelEl.style.height = '100%';
  $('ctlRun').hidden = true; $('ctlDone').hidden = false;
  play(FINAL_RING.concat(JINGLE.done.map(n => [n[0], n[1] + 6, n[2], n[3], n[4]]))); vib([200,100,200,100,400]);
  $('againBtn').focus({preventScroll:true});
}
function exitRun(){
  halt(); disarmStop();
  runEl.hidden = true; document.body.style.overflow = '';
  renderSetup();
  $('startBtn').focus({preventScroll:true});
}
function togglePause(){
  if(!running) return;
  if(!paused){
    paused = true; pausedRemain = endAt - performance.now();
    beatStop();
    runEl.classList.add('paused'); pauseBtn.textContent = '계속하기';
  } else {
    ensureAudio();
    paused = false; endAt = performance.now() + pausedRemain;
    runEl.classList.remove('paused'); pauseBtn.textContent = '일시정지';
    { const pt = phases[idx].t; if(pt === 'work') beatStart(.05); else if(pt === 'rest' || pt === 'setrest' || pt === 'prep') beatStart(.05, 'rest'); }
  }
}
function skip(){
  if(!running) return;
  const ok = enter(idx + 1, performance.now());
  if(ok && paused) pausedRemain = phases[idx].d * 1000;
}
function disarmStop(){ clearTimeout(stopTimer); stopBtn.classList.remove('armed'); stopBtn.textContent = '운동종료'; }
function stopTap(){
  if(stopBtn.classList.contains('armed')){ exitRun(); return; }
  stopBtn.classList.add('armed'); stopBtn.textContent = '한 번 더 누르면 종료';
  stopTimer = setTimeout(disarmStop, 2500);
}

$('startBtn').addEventListener('click', startWorkout);
$('againBtn').addEventListener('click', startWorkout);
$('backBtn').addEventListener('click', exitRun);
pauseBtn.addEventListener('click', togglePause);
$('skipBtn').addEventListener('click', skip);
stopBtn.addEventListener('click', stopTap);
document.addEventListener('keydown', e => {
  if(runEl.hidden) return;
  if(e.key === ' ' && running && e.target.tagName !== 'BUTTON'){ e.preventDefault(); togglePause(); }
  if(e.key === 'Escape') running ? stopTap() : exitRun();
});

renderSetup();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
